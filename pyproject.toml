[project]
name = "enterprise-agentic-ai-copilot"
version = "0.2.0"
description = "DEPI enterprise AI teaching project, Module 8 RAG baseline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3"
]

[project.optional-dependencies]
rag = [
  "pymupdf>=1.24,<2",
  "chromadb>=0.5,<2",
  "sentence-transformers>=3,<6",
  "openai>=1.40,<3"
]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
